<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sparkle Clean - AI Voice Assistant</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .app-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 90%;
            text-align: center;
        }

        .logo {
            margin-bottom: 30px;
        }

        .logo h1 {
            color: #4CAF50;
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .logo p {
            color: #666;
            font-size: 1.1em;
        }

        .status-section {
            margin-bottom: 30px;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            transition: all 0.3s ease;
        }

        .status-indicator.online {
            background: #4CAF50;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
        }

        .status-indicator.offline {
            background: #f44336;
            animation: pulse 2s infinite;
        }

        .status-indicator.active {
            background: #2196F3;
            animation: pulse 1s infinite;
        }

        .status-text {
            color: #666;
            font-size: 1em;
        }

        .voice-call-btn {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            font-size: 2.5em;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(76, 175, 80, 0.3);
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .voice-call-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(76, 175, 80, 0.4);
        }

        .voice-call-btn:active {
            transform: translateY(-2px);
        }

        .voice-call-btn.connected {
            background: linear-gradient(45deg, #2196F3, #1976D2);
            box-shadow: 0 10px 20px rgba(33, 150, 243, 0.3);
            animation: pulse 2s infinite;
        }

        .btn-text {
            font-size: 0.9em;
            font-weight: 600;
            margin-top: 10px;
            display: block;
        }

        .audio-controls {
            display: none;
            gap: 20px;
            justify-content: center;
            margin: 20px 0;
        }

        .control-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.9);
            color: #666;
            font-size: 1.5em;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .control-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        .control-btn.muted {
            background: linear-gradient(45deg, #f44336, #d32f2f);
            color: white;
        }

        .end-call-btn {
            background: linear-gradient(45deg, #f44336, #d32f2f);
            color: white;
        }

        .recording-indicator {
            display: none;
            margin: 20px 0;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .recording-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #f44336;
            animation: pulse 1s infinite;
        }

        .recording-text {
            color: #666;
            font-size: 0.9em;
        }

        .conversation-panel {
            display: none;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
            backdrop-filter: blur(10px);
        }

        .messages {
            margin-bottom: 15px;
            min-height: 100px;
            max-height: 200px;
            overflow-y: auto;
        }

        .message {
            margin-bottom: 10px;
            padding: 10px 15px;
            border-radius: 15px;
            max-width: 80%;
            word-wrap: break-word;
            font-size: 0.9em;
            line-height: 1.4;
        }

        .message.user {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            color: white;
            margin-left: auto;
            border-radius: 15px 15px 5px 15px;
        }

        .message.bot {
            background: linear-gradient(45deg, #e3f2fd, #f3e5f5);
            color: #333;
            margin-right: auto;
            border-radius: 15px 15px 15px 5px;
        }

        .transcription {
            padding: 10px;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 10px;
            font-size: 0.9em;
            color: #666;
            font-style: italic;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        .loading-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4CAF50;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        .features {
            margin-top: 30px;
            text-align: left;
        }

        .features h3 {
            color: #4CAF50;
            margin-bottom: 15px;
            font-size: 1.2em;
        }

        .features ul {
            list-style: none;
            padding: 0;
        }

        .features li {
            padding: 8px 0;
            color: #666;
            font-size: 0.9em;
        }

        .features li i {
            color: #4CAF50;
            margin-right: 10px;
            width: 20px;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            .app-container {
                padding: 20px;
                margin: 20px;
            }
            
            .logo h1 {
                font-size: 2em;
            }
            
            .voice-call-btn {
                width: 100px;
                height: 100px;
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="logo">
            <h1><i class="fas fa-sparkles"></i> Sparkle Clean</h1>
            <p>AI Voice Assistant</p>
        </div>

        <div class="status-section">
            <span id="statusIndicator" class="status-indicator offline"></span>
            <span class="status-text">Connecting...</span>
        </div>

        <button id="voiceCallBtn" class="voice-call-btn">
            <i id="callIcon" class="fas fa-phone"></i>
            <span id="btnText" class="btn-text">Start Voice Call</span>
        </button>

        <div id="audioControls" class="audio-controls">
            <button id="muteBtn" class="control-btn">
                <i class="fas fa-microphone"></i>
            </button>
            <button id="endCallBtn" class="control-btn end-call-btn">
                <i class="fas fa-phone-slash"></i>
            </button>
        </div>

        <div id="recordingIndicator" class="recording-indicator">
            <div class="recording-dot"></div>
            <span class="recording-text">Listening...</span>
        </div>

        <div id="conversationPanel" class="conversation-panel">
            <div id="messages" class="messages"></div>
            <div id="transcription" class="transcription">
                Ready to listen...
            </div>
        </div>

        <div class="features">
            <h3><i class="fas fa-magic"></i> New Features</h3>
            <ul>
                <li><i class="fas fa-bolt"></i> Live Speech Recognition</li>
                <li><i class="fas fa-stream"></i> Streaming AI Responses</li>
                <li><i class="fas fa-volume-up"></i> Real-time Voice Synthesis</li>
                <li><i class="fas fa-rocket"></i> Ultra-Fast Response Times</li>
            </ul>
        </div>
    </div>

    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <p>Connecting call...</p>
        </div>
    </div>

    <audio id="audioPlayer" style="display: none;"></audio>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
