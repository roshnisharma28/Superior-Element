<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sparkle Clean - Voice Assistant</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .header p {
            color: #666;
            font-size: 16px;
        }

        .status-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
            gap: 10px;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-indicator.online {
            background: #4ade80;
        }

        .status-indicator.offline {
            background: #ef4444;
        }

        .status-indicator.active {
            background: #3b82f6;
        }

        .status-text {
            color: #666;
            font-size: 14px;
        }

        .call-button {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(45deg, #4ade80, #22c55e);
            color: white;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(34, 197, 94, 0.3);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 8px;
        }

        .call-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(34, 197, 94, 0.4);
        }

        .call-button.connected {
            background: linear-gradient(45deg, #3b82f6, #1d4ed8);
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
        }

        .call-button.connected:hover {
            box-shadow: 0 15px 40px rgba(59, 130, 246, 0.4);
        }

        .call-button i {
            font-size: 32px;
        }

        .btn-text {
            font-size: 12px;
            font-weight: 500;
        }

        .audio-controls {
            display: none;
            gap: 20px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mute-btn {
            background: linear-gradient(45deg, #64748b, #475569);
            color: white;
        }

        .mute-btn.muted {
            background: linear-gradient(45deg, #ef4444, #dc2626);
        }

        .end-call-btn {
            background: linear-gradient(45deg, #ef4444, #dc2626);
            color: white;
        }

        .control-btn:hover {
            transform: translateY(-2px);
        }

        .conversation-panel {
            display: none;
            background: #f8fafc;
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            max-height: 300px;
            overflow-y: auto;
        }

        .messages {
            margin-bottom: 15px;
        }

        .message {
            margin-bottom: 10px;
            padding: 10px 15px;
            border-radius: 15px;
            max-width: 80%;
            word-wrap: break-word;
        }

        .message.user {
            background: #e0f2fe;
            margin-left: auto;
            text-align: right;
        }

        .message.bot {
            background: #f3e8ff;
            margin-right: auto;
            text-align: left;
        }

        .transcription {
            font-size: 14px;
            color: #666;
            font-style: italic;
            text-align: center;
            padding: 10px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 10px;
        }

        .recording-indicator {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            color: #ef4444;
            font-size: 14px;
        }

        .recording-dot {
            width: 8px;
            height: 8px;
            background: #ef4444;
            border-radius: 50%;
            animation: blink 1s infinite;
        }

        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .loading-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✨ Sparkle Clean</h1>
            <p>Voice Assistant</p>
        </div>

        <div class="status-container">
            <div id="statusIndicator" class="status-indicator offline"></div>
            <span class="status-text">Connecting...</span>
        </div>

        <button id="voiceCallBtn" class="call-button">
            <i id="callIcon" class="fas fa-phone"></i>
            <span id="btnText" class="btn-text">Start Voice Call</span>
        </button>

        <div id="recordingIndicator" class="recording-indicator">
            <div class="recording-dot"></div>
            <span>Recording...</span>
        </div>

        <div id="audioControls" class="audio-controls">
            <button id="muteBtn" class="control-btn mute-btn">
                <i class="fas fa-microphone"></i>
            </button>
            <button id="endCallBtn" class="control-btn end-call-btn">
                <i class="fas fa-phone-slash"></i>
            </button>
        </div>

        <div id="conversationPanel" class="conversation-panel">
            <div id="messages" class="messages"></div>
            <div id="transcription" class="transcription"></div>
        </div>
    </div>

    <div id="loadingOverlay" class="loading-overlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <p>Connecting call...</p>
        </div>
    </div>

    <audio id="audioPlayer" style="display: none;"></audio>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
